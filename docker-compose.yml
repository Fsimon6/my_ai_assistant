version: '3.8'

services:
  # 主应用服务
  ai-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-ai-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - LLM_PROVIDER=${LLM_PROVIDER:-qianfan}
      - QIANFAN_API_KEY=${QIANFAN_API_KEY}
      - QIANFAN_SECRET_KEY=${QIANFAN_SECRET_KEY}
      - VECTOR_DB_PATH=/app/data/chroma_db
    volumes:
      - ai_assistant_data:/app/data
      - ./backend:/app/backend  # 开发时挂载代码
      - ./.env.example:/app/.env.example
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis缓存服务（可选）
  redis:
    image: redis:7-alpine
    container_name: ai-assistant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: ai-assistant-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - ai-assistant
    networks:
      - ai-network

  # 前端开发服务器（开发环境）
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ai-assistant-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - ai-network
    stdin_open: true
    tty: true

networks:
  ai-network:
    driver: bridge

volumes:
  ai_assistant_data:
    driver: local
  redis_data:
    driver: local