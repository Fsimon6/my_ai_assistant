# 开发环境 Docker Compose 配置
version: '3.8'

services:
  # 后端服务
  backend-dev:
    build:
      # backend/Dockerfile 使用仓库根上下文中的 backend/... 路径；
      # 开发入口也使用同一上下文，避免 COPY 路径和上下文不一致。
      context: .
      dockerfile: backend/Dockerfile
    # 仅向后端容器注入运行时配置；.env 不会进入镜像。
    # Compose 的 environment 会覆盖 env_file 中的同名值。
    env_file:
      - .env
    ports:
      # 宿主机继续使用 8021；容器内部仍使用 Docker 约定的 8000。
      - "8021:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/my_ai_assistant.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      - redis
      - chroma
    command: >
      sh -c "python -m backend.init_db && if [ \"$${DEBUG:-false}\" = \"true\" ]; then exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload; else exec uvicorn backend.main:app --host 0.0.0.0 --port 8000; fi"
    restart: unless-stopped

  # 前端开发服务器
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      # 宿主机与项目 Vite 开发端口保持一致。
      - "5181:5181"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # 仅容器内 Vite 代理使用；不是浏览器公开的 VITE_* 配置。
      - DEV_PROXY_TARGET=http://backend-dev:8000
    command: npm run dev -- --host 0.0.0.0 --port 5181
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ChromaDB向量数据库
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # PostgreSQL（可选，用于生产开发）
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ai_assistant
      - POSTGRES_PASSWORD=ai_assistant_pass
      - POSTGRES_DB=ai_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # pgAdmin（PostgreSQL管理界面）
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  # Redis管理界面
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # 监控服务
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data: