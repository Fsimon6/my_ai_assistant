[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# D1/D1.5：本文件保留项目元数据与构建职责；后端运行/开发安装的
# 直接依赖权威分别为 backend/requirements.txt / requirements-dev.txt。
# 完整锁定文件由后续 D2 建立。

[project]
name = "my-ai-assistant"
version = "1.0.0"
description = "基于大模型的本地知识库智能问答助手"
readme = "README.md"
requires-python = ">=3.10.11,<3.11"
license = {text = "MIT"}
authors = [
    {name = "FSimon", email = "2376709678@qq.com"}
]
keywords = ["ai", "assistant", "knowledge-base", "rag", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

# 运行与开发直接依赖不在本文件声明：
# backend/requirements.txt / backend/requirements-dev.txt

[project.urls]
Homepage = "https://github.com/FSimon/my_ai_assistant"
Repository = "https://github.com/FSimon/my_ai_assistant.git"
Issues = "https://github.com/FSimon/my_ai_assistant/issues"
Documentation = "https://github.com/FSimon/my_ai_assistant/wiki"

[tool.black]
line-length = 127
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parenttheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "venv/",
    ".venv/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-v",
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow tests",
    "skip: skip this test",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/venv/*",
    "backend/.venv/*",
    "backend/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "reise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]